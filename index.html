<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03040a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="An interactive, cinematic 3D journey through the Solar System."
    />
    <title>Solar System — An Interactive Journey</title>

    <!-- Social sharing (Open Graph / Twitter).
         DEPLOY TODO: once the public URL is known, add
           <link rel="canonical" href="https://YOUR-DOMAIN/" />
           <meta property="og:url" content="https://YOUR-DOMAIN/" />
         and make og:image / twitter:image absolute (https://YOUR-DOMAIN/og-image.jpg);
         most crawlers ignore relative image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Interactive 3D Solar System" />
    <meta property="og:title" content="Solar System — An Interactive Journey" />
    <meta
      property="og:description"
      content="An interactive, cinematic 3D journey through the Solar System."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Sun and planets on their orbits, rendered in 3D"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solar System — An Interactive Journey" />
    <meta
      name="twitter:description"
      content="An interactive, cinematic 3D journey through the Solar System."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <noscript>
      <div
        style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #03040a; color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center;"
      >
        <p>
          This interactive 3D Solar System needs JavaScript and WebGL. Please
          enable JavaScript in your browser to explore it.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
